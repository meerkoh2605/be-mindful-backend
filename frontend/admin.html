<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Mindful Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .admin-form input,
    .admin-form textarea {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-family: inherit;
    }

    .admin-form textarea {
      min-height: 300px;
      resize: vertical;
    }

    .admin-form button {
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #articleList {
      margin-top: 30px;
    }

    #articleList div {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>

<body>

  <div class="admin-container">

    <h1>Be Mindful Admin</h1>

    <form class="admin-form">

      <input type="text" id="title" placeholder="Article Title">
      <input type="text" id="slug" placeholder="article-slug">
      <input type="text" id="summary" placeholder="Short Summary">
      <input type="text" id="image" placeholder="Image filename">
      
      <textarea id="content" placeholder="Article content..."></textarea>

      <button type="button" id="publishBtn">
        Publish Article
      </button>

    </form>

    <!-- IMPORTANT: THIS FIXES YOUR ISSUE -->
    <h2>Articles</h2>
    <div id="articleList"></div>

  </div>

  <script src="admin.js"></script>

</body>
</html>
