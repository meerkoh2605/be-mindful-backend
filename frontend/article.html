<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Be Mindful</title>

  <!-- FAVICON (THIS IS THE FIX) -->
  <link rel="icon" type="image/png" href="/favicon.png?v=2">

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Be Mindful</h1>
    <p>Simple psychology insights for everyday life</p>
  </header>

  <main>
    <div id="article"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    let currentArticle = null;

    fetch(`/articles/${slug}`)
      .then(res => res.json())
      .then(article => {
        currentArticle = article;
        renderArticle(article);
      });

    function renderArticle(article) {
      document.title = article.title + " | Be Mindful";

      document.getElementById("article").innerHTML = `
        <a href="index.html">← Back</a>

        <h1>${article.title}</h1>

        <img src="${article.image}" style="width:100%; border-radius:10px; margin:15px 0;" />

        <div class="article-content">
          ${article.content}
        </div>
      `;
    }
  </script>

</body>
</html>
